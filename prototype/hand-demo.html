<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>손 인식 데모</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#0A0A0A;color:#F2EBD8;font:16px/1.4 system-ui,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;background:radial-gradient(120% 60% at 50% 0%,#E8261C 0%,#0A0A0A 60%)}
  #hand{position:absolute;width:160px;height:100px;margin:-50px 0 0 -80px;pointer-events:none;opacity:0;transition:opacity .15s}
  #cam{position:fixed;right:16px;bottom:16px;width:200px;transform:scaleX(-1);border:3px solid #E8261C;border-radius:6px;background:#000}
  #msg{position:fixed;top:24px;left:0;right:0;text-align:center;font-size:20px}
  #bar{position:fixed;left:16px;bottom:16px;display:flex;gap:8px}
  button{background:#E8261C;color:#F2EBD8;border:3px solid #0A0A0A;padding:10px 16px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="stage"><img id="hand" src="../assets/hand.svg" alt=""></div>
<div id="msg">카메라를 켜는 중...</div>
<video id="cam" autoplay playsinline muted></video>
<div id="bar"><button id="toMouse">마우스로 테스트</button></div>
<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/vision_bundle.mjs";

const FOLLOW_Y = true;      // 게임에서는 가로(x)만 쓴다. 데모는 세로도 따라간다.
const SMOOTH = 0.35;        // 0~1, 클수록 빠르게 따라감
const LOST_MS = 300;        // 이 시간 동안 두 손이 안 보이면 손 그래픽을 숨김

const hand = document.getElementById('hand');
const msg = document.getElementById('msg');
const cam = document.getElementById('cam');
let pos = { x: innerWidth / 2, y: innerHeight * 0.75 };
let target = { ...pos };
let lastSeen = 0;
let mouseMode = false;

function render(now) {
  const seen = mouseMode || now - lastSeen < LOST_MS;
  hand.style.opacity = seen ? 1 : 0;
  msg.textContent = seen ? '' : '두 손을 보여주세요';
  pos.x += (target.x - pos.x) * SMOOTH;
  pos.y += (target.y - pos.y) * SMOOTH;
  hand.style.left = pos.x + 'px';
  hand.style.top = pos.y + 'px';
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

document.getElementById('toMouse').onclick = () => {
  mouseMode = true;
  cam.style.display = 'none';
  addEventListener('pointermove', e => {
    target.x = e.clientX;
    target.y = FOLLOW_Y ? e.clientY : innerHeight * 0.75;
  });
};

try {
  const fileset = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.21/wasm");
  const landmarker = await HandLandmarker.createFromOptions(fileset, {
    baseOptions: { modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" },
    runningMode: "VIDEO",
    numHands: 2
  });
  cam.srcObject = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
  await cam.play();

  let lastVideoTime = -1;
  (function loop() {
    if (!mouseMode && cam.currentTime !== lastVideoTime) {
      lastVideoTime = cam.currentTime;
      const res = landmarker.detectForVideo(cam, performance.now());
      if (res.landmarks.length >= 2) {
        // 두 손이 보이면 모은 것으로 본다. 두 손목(0번)의 중간점, 좌우 반전.
        const a = res.landmarks[0][0], b = res.landmarks[1][0];
        target.x = (1 - (a.x + b.x) / 2) * innerWidth;
        target.y = FOLLOW_Y ? ((a.y + b.y) / 2) * innerHeight : innerHeight * 0.75;
        lastSeen = performance.now();
      }
    }
    if (!mouseMode) requestAnimationFrame(loop);
  })();
} catch (e) {
  msg.textContent = '카메라를 쓸 수 없어요 (' + (e.message || e) + '). 아래 버튼으로 마우스 테스트를 해 보세요.';
}
</script>
</body>
</html>
